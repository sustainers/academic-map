name: deploy-book

# Runs on main branch changes or manual dispatch
on:
  workflow_dispatch:
  push:
    branches:
    - main

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v7

    # BUILD FIRST - Fail fast if there are build issues
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: 3.11

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Build the book
      run: |
        echo "Starting Jupyter Book build..."
        jupyter-book build --all .
        
        # Verify the build created the output directory and files
        if [ ! -d "_build/html" ]; then
          echo "❌ Error: Build failed to create _build/html directory"
          exit 1
        fi
        if [ ! -f "_build/html/index.html" ]; then
          echo "❌ Error: Build did not create index.html"
          exit 1
        fi
        
        echo "✅ Build successful - _build/html created with $(find _build/html -name '*.html' | wc -l) HTML files"

    # THEN run checks (lint, TOC). External links are checked on PRs and weekly
    # in link-check.yml, so a third-party outage can't block a deploy.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Lint markdown files
      run: npm run lint

    - name: Check TOC completeness
      run: npm run check-toc

    # Upload the book's HTML as an artifact
    - name: Upload artifact
      if: success()
      uses: actions/upload-pages-artifact@v5
      with:
        path: "_build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:

    # Deploy the book's HTML to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
