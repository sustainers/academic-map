name: deploy-book

# Runs on main branch changes, on manual dispatch, and daily, so that member
# logos and funding calls from curioss.org stay current
on:
  workflow_dispatch:
  push:
    branches:
    - main
  schedule:
  - cron: '17 6 * * *'

# This job installs dependencies, builds the book, checks it, and publishes it
# to curioss.org/academic-map
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    # BUILD FIRST - Fail fast if there are build issues
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: 3.11

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Fetch CURIOSS member logos and funding calls
      run: python scripts/sync_curioss.py

    - name: Build the book
      run: |
        echo "Starting Jupyter Book build..."
        jupyter-book build --all .
        
        # Verify the build created the output directory and files
        if [ ! -d "_build/html" ]; then
          echo "❌ Error: Build failed to create _build/html directory"
          exit 1
        fi
        if [ ! -f "_build/html/index.html" ]; then
          echo "❌ Error: Build did not create index.html"
          exit 1
        fi
        
        echo "✅ Build successful - _build/html created with $(find _build/html -name '*.html' | wc -l) HTML files"

    # THEN run checks (lint, TOC). External links are checked on PRs and weekly
    # in link-check.yml, so a third-party outage can't block a deploy.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Lint markdown files
      run: npm run lint

    - name: Check TOC completeness
      run: npm run check-toc

    # Publish the book at curioss.org/academic-map. The curioss.org site is a
    # Hugo site that serves anything under static/ as-is, so the built HTML is
    # pushed into its static/academic-map folder, the same way curioss-patterns
    # publishes to static/patterns. That push triggers curioss.org's own deploy.
    # ACADEMIC_MAP_DEPLOY_KEY is the private half of a deploy key that has write
    # access to CURIOSSorg/curioss.org.
    - name: Deploy to curioss.org
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACADEMIC_MAP_DEPLOY_KEY }}
        external_repository: CURIOSSorg/curioss.org
        publish_branch: main
        publish_dir: ./_build/html
        destination_dir: static/academic-map
        keep_files: false
        commit_message: "Deploy the academic map"
