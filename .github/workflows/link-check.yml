name: Lint Markdown and check links
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Weekly, to catch links that die between PRs
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm ci
      - name: Lint markdown
        run: npm run lint
      - name: Check Table of Contents
        if: success() || failure()
        run: npm run check-toc
      - name: Link check
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run links-ci
